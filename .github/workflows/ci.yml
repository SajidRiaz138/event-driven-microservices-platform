# CI for the event-driven order platform.
#
# What this proves on every push/PR:
#   build-and-test  the whole reactor compiles and BOTH test layers pass — Surefire unit
#                   tests (*Test) and Failsafe integration tests (*IT) against real
#                   Postgres 17.6 and Kafka 4.1.2 via Testcontainers. The ITs are gated by
#                   @EnabledIfEnvironmentVariable(named = "DOCKER_AVAILABLE", matches =
#                   "true"), so DOCKER_AVAILABLE=true is mandatory here: without it they are
#                   silently skipped, not failed, and the build would be green for the wrong
#                   reason. GitHub-hosted ubuntu runners ship a working Docker daemon.
#   sbom            CycloneDX aggregate SBOM for the reactor (supply chain, SECURITY.md).
#   security-scan   Trivy filesystem scan for vulnerable dependencies and leaked secrets.
#   docker-images   the four service images actually build from their Dockerfiles. Nothing
#                   is pushed anywhere.
#
# Action versions are pinned to majors that exist today: actions/checkout v7,
# actions/setup-java v6, actions/upload-artifact v7, aquasecurity/trivy-action v0.36.0
# (that action publishes no floating major tag, hence the exact version).

name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:

  build-and-test:
    name: Build + unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the whole reactor with unit and integration tests
        # Avro sources are generated in generate-sources, so no separate codegen step.
        env:
          DOCKER_AVAILABLE: 'true'
        run: ./mvnw $MAVEN_ARGS clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: '**/target/site/jacoco/'
          if-no-files-found: warn

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Invoked as a CLI goal rather than declared in the POM: the SBOM is a CI artifact,
      # and keeping it out of the POM leaves the developer build (and its test config)
      # untouched. The version is pinned so the build is reproducible.
      - name: Generate aggregate SBOM
        run: >
          ./mvnw $MAVEN_ARGS -DskipTests
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            **/target/bom.json
          if-no-files-found: error

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Non-blocking on purpose: a scanner that fails the build on a newly published CVE
      # turns every unrelated PR red, and its vulnerability database is a network
      # dependency. The report is published as an artifact and reviewed; promote this to
      # blocking (exit-code 1) once the findings are triaged to zero.
      - name: Trivy filesystem scan (dependencies + secrets)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn

  docker-images:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Uses the same compose file a developer runs locally, so this job fails if the local
      # stack would fail to build. Images stay on the runner — nothing is pushed.
      - name: Build all four service images
        run: docker compose -f deploy/local/compose.yaml build

      - name: List built images
        run: docker images 'edmp/*'
