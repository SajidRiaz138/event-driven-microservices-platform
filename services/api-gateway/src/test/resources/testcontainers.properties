# Testcontainers configuration for api-gateway integration tests.
#
# Disable the Ryuk resource reaper, matching the other service modules: in this environment Ryuk
# has been observed reclaiming containers while a test class was still using them, which surfaces
# as connection failures that look like application bugs.
#
# This classpath file complements the TESTCONTAINERS_RYUK_DISABLED environment variable set by the
# maven-failsafe-plugin in this module's pom: the env var covers Maven builds, this file covers
# runs launched directly from an IDE, which never go through the plugin.
#
# Trade-off: with the reaper disabled, containers are torn down by the JVM shutdown hook instead,
# so a forcibly-killed test JVM can leave containers running.
ryuk.disabled=true
