spring:
  jpa:
    hibernate:
      # Flyway owns the schema (ADR-0004 migrations); Hibernate must only validate it
      # in tests too, matching production. `create-drop` here was a leftover from the
      # original generic-CRUD prototype (pre-rework) that used an in-memory H2 DB with
      # no Flyway. With Testcontainers Postgres + Flyway, `create-drop` makes Hibernate
      # try to DROP the schema on every ApplicationContext shutdown, which needs a live
      # JDBC connection at exactly the moment the test's Postgres/Kafka containers are
      # being torn down — this was hanging for the shutdown timeout and taking the
      # containers down with it, causing every OrderPlacementIT scenario to fail with
      # spurious "connection refused" / NullPointerException symptoms.
      ddl-auto: validate
