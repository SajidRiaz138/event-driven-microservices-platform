server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    # Its own least-privilege role (ADR-0007), not the shared bootstrap `appuser`. order_svc
    # is granted USAGE + CREATE on `public` and nothing else, so Flyway can create this
    # service's tables and its own history table, and cannot see the payment or inventory
    # schemas at all. Provisioned by deploy/local/postgres-init/02-service-roles.sh (compose
    # and Helm share that file); a real deployment provisions the role its own way and
    # overrides these two properties.
    #
    # This service stays on `public` rather than moving to an `order` schema: V1's
    # uuid_generate_v4() column DEFAULTs are resolved when CREATE TABLE is parsed, and
    # scoping the connection to another schema would put the extension's function out of
    # search_path and fail the migration. See 02-service-roles.sh for the full rationale.
    username: ${POSTGRES_ORDER_USER:order_svc}
    password: ${POSTGRES_ORDER_PASSWORD:changeme-dev-only}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Envelopes (and the Avro payloads they carry) are serialized to bytes
      # in-process; Kafka transports opaque byte[] only. See ADR-0010's note on the
      # envelope payload being `bytes`, and the order-service pom for why this avoids
      # a dependency on the Confluent schema-registry serializer/repository.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      # Manual ack: the offset is committed only after the business change +
      # processed_message dedup row are committed in the same DB transaction
      # (ADR-0005, ADR-0014).
      ack-mode: manual

  flyway:
    enabled: true
    locations: classpath:db/migration

  # OAuth2 resource server (ADR-0009, ADR-0018). The issuer is Keycloak's realm URL; the
  # JWKS endpoint is derived from it by Keycloak convention and can be overridden on its own
  # for deployments that front Keycloak differently. `sub` from a token validated here is the
  # customer id — no header is trusted for identity.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/order-platform}
          jwk-set-uri: ${JWT_JWKS_URI:${JWT_ISSUER_URI:http://localhost:8180/realms/order-platform}/protocol/openid-connect/certs}

order-platform:
  outbox:
    relay:
      # Outbox relay poll interval (ADR-0004). SELECT ... FOR UPDATE SKIP LOCKED lets
      # multiple replicas drain the outbox concurrently without double-publishing.
      fixed-delay-ms: 500
      batch-size: 50
  saga:
    # TTL carried on the ReserveStock command so inventory can expire an abandoned
    # reservation on its own (ADR-0015). Now actually read by SagaOrchestrator via
    # SagaConfig — it used to be shadowed by a hard-coded Java constant.
    reservation-ttl-seconds: 900
    step-timeout:
      # Per-step reply budgets driving saga_instance.deadline (ADR-0003). NOTE: no ADR or
      # NFR pins these numbers — NFR-and-SLO only sets an end-to-end p95 < 3s target — so
      # they are a deliberate implementation choice, set well above the p95 so that a
      # merely slow participant is not mistaken for a dead one.
      stock-reservation-seconds: 30
      payment-authorization-seconds: 30
      # Breaching THIS budget never cancels the order: an unknown capture outcome is
      # neither success nor failure (ADR-0003). See SagaOrchestrator.onStepTimeout.
      payment-capture-seconds: 30
    timeout-sweep:
      fixed-delay-ms: 1000
      batch-size: 50
  security:
    # Audience this service requires in the `aud` claim (ADR-0009). Kept as a platform
    # property rather than spring.security.oauth2.resourceserver.jwt.audiences because the
    # decoder is built explicitly in SecurityConfig: the audience check is the one Boot's
    # auto-configured decoder would not perform, so it is wired by hand and on purpose.
    jwt:
      audience: ${JWT_AUDIENCE:order-platform}

logging:
  # ADR-0013 promises that one correlationId stitches an entire business flow together in
  # the logs, and scripts/demo.sh prints one and tells you to grep for it. Nothing put the
  # MDC into the output, so neither was true. This substitutes the level field of Boot's
  # default console pattern — the same mechanism Sleuth used — so every line reads
  #   INFO [order-service,<correlationId>,<traceId>]
  # The `:-` defaults keep lines with no ambient context (the timeout sweeper, startup)
  # readable instead of printing "null".
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-}]"
  level:
    com.sajidriaz.orderplatform: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # /actuator/health/readiness and /actuator/health/liveness do not exist unless this
      # is on. It was only ever set as a container environment variable, so any deployment
      # that forgot it got pods whose readiness probe 404s forever — the endpoint the
      # compose healthchecks and the Helm probes both depend on. Defaulted here, still
      # overridable by MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED.
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      # Readiness deliberately contains ONLY the application's own readiness state — not db,
      # not Kafka, not any other dependency indicator (ADR-0014).
      #
      # This is the behaviour Spring Boot already defaults to, and that is exactly why it is
      # written down: it was an invariant the whole deployment depends on that nothing in the
      # repository stated, so a future change to a framework default could have moved a
      # dependency into this group and nobody would have been looking. Kubernetes removes a
      # NotReady pod from its Service, so a db-gated readiness group turns one Postgres blip
      # into every replica leaving rotation at once — the outage the blip did not cause. The
      # platform already handles transient dependency failure at the application level
      # (consumer retries, the transactional outbox, idempotent replay), so readiness answers
      # "is this application up and able to serve", not "is every dependency healthy".
      #
      # Liveness is unchanged and stays separate: a service that cannot reach Postgres is
      # retrying, not wedged, and restarting it would help nothing.
      #
      # The aggregate /actuator/health keeps every indicator, including db, for humans and
      # for monitoring — this only scopes what the probe endpoint answers for.
      group:
        readiness:
          include: readinessState
