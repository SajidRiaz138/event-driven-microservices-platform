# Testcontainers configuration for payment-service integration tests.
#
# Disable the Ryuk resource reaper. In this environment Ryuk has been observed reclaiming a
# module's Postgres container while a test class was still using it, surfacing as
# postmaster-exit / connection-refused failures that look like application bugs.
#
# This classpath file complements the TESTCONTAINERS_RYUK_DISABLED environment variable set by
# the maven-failsafe-plugin in this module's pom: the env var covers Maven builds, this file
# covers runs launched directly from an IDE, which never go through the plugin.
#
# NOTE: there is deliberately no src/test/resources/application.yml in this module. A file at that
# path occupies the same classpath location as the main application.yml (classpath:/application.yml)
# and shadows it entirely — the first match on the classpath wins — which silently disables every
# main setting during tests. Test-specific overrides belong in @DynamicPropertySource instead.
#
# Trade-off: with the reaper disabled, containers are torn down by the JVM shutdown hook instead,
# so a forcibly-killed test JVM can leave containers running.
ryuk.disabled=true
