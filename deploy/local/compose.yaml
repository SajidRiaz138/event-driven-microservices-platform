# One-command local stack for the event-driven order platform.
#
#   make up     -> docker compose -f deploy/local/compose.yaml up -d --build --wait
#   make demo   -> scripts/demo.sh   (happy path + payment-decline compensation)
#   make smoke  -> scripts/smoke.sh  (fast liveness check)
#   make down   -> docker compose -f deploy/local/compose.yaml down -v
#
# Everything a reviewer touches goes through the gateway on http://localhost:8090.
# order/payment/inventory are internal: they are deliberately NOT published to the host,
# because the point of the demo is that the edge is the only entry point (ADR-0009).
#
# Images are pinned: Postgres 17.6 and Kafka 4.1.2 are the same versions the Testcontainers
# integration tests run against, so "it passes CI" and "it runs locally" mean the same thing.
#
# No Schema Registry: the services serialize Avro to bytes in-process and transport raw
# byte[] (ByteArraySerializer), so there is nothing for a registry to do here (ADR-0017).

name: edmp

services:

  # ---------------------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------------------

  postgres:
    image: postgres:17.6
    container_name: edmp-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-changeme-dev-only}
      # Read by postgres-init/02-service-roles.sh to set each service role's password, and
      # passed to the services themselves below — one value per role, so the two sides
      # cannot disagree. Dev defaults; nothing real is committed (see .env.example).
      POSTGRES_ORDER_PASSWORD: ${POSTGRES_ORDER_PASSWORD:-changeme-dev-only}
      POSTGRES_PAYMENT_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD:-changeme-dev-only}
      POSTGRES_INVENTORY_PASSWORD: ${POSTGRES_INVENTORY_PASSWORD:-changeme-dev-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema AND role per service (ADR-0007): 01-extensions.sql installs uuid-ossp,
      # 02-service-roles.sh creates order_svc/payment_svc/inventory_svc and grants each one
      # only its own schema. appuser remains the bootstrap/admin role — no service uses it.
      # Both scripts run once, on first init of the volume; `make down` removes the volume,
      # so a fresh `make up` always re-provisions them.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d orderdb" ]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  kafka:
    # KRaft single node: no ZooKeeper. Two listeners on purpose — PLAINTEXT is advertised as
    # kafka:9092 for the services inside this network, PLAINTEXT_HOST as localhost:29092 so
    # a host-side console consumer can watch the same topics.
    image: apache/kafka:4.1.2
    container_name: edmp-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Topics follow commands.<target>.<action>.v1 / events.<owner>.<fact>.v1 and are
      # auto-created on first use for the local stack (ADR-0010 pins the naming, not the
      # provisioning). Production creates them explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s
    mem_limit: 1g

  redis:
    # Not published to the host: only inventory-service talks to it, and 6379 is frequently
    # already taken by a local Redis. Reach it with
    #   docker compose -f deploy/local/compose.yaml exec redis redis-cli
    image: redis:7-alpine
    container_name: edmp-redis
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  # auth-service = Keycloak (ADR-0018). There is no hand-rolled OAuth2 server: the realm
  # (clients, the orders:* scopes, the audience mapper, demo users) comes from the
  # version-controlled export below, so `make up` produces the same identity provider every
  # time and the file is exercised by api-gateway's KeycloakRealmImportIT.
  #
  # Port 8180 on the host: Keycloak's own default is 8080, which order-service already uses.
  #
  # KC_HOSTNAME is the one thing that changed when the services moved into compose. The
  # services validate the `iss` claim by exact string equality (PlatformJwtDecoders), so the
  # issuer Keycloak stamps must be the SAME string the containers are configured with.
  # Pinning the frontend URL to http://keycloak:8080 gives one issuer that is valid
  # everywhere: tokens minted for a host script that posted to localhost:8180 still carry
  # iss=http://keycloak:8080/realms/order-platform, which is exactly what the containers
  # expect and can also reach for JWKS. The alternative (leaving the issuer as
  # localhost:8180 and only redirecting JWKS internally) would break the gateway's
  # /api/v1/auth/token route, whose target is derived from the same issuer URL.
  #
  # start-dev is deliberate for a local stack — it enables HTTP and a dev database so there
  # is nothing to provision. It is NOT a production configuration (production needs a real
  # database, HTTPS and a public KC_HOSTNAME).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: edmp-keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      # Admin console credentials (local only). KC_BOOTSTRAP_ADMIN_* replaced the older
      # KEYCLOAK_ADMIN_* names in Keycloak 26.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      # Read-only: the container imports this on startup and must never write to it.
      - ../../services/auth-service/realm/order-platform-realm.json:/opt/keycloak/data/import/order-platform-realm.json:ro
    healthcheck:
      # The realm's own discovery document, not just a listening port: the realm import runs
      # during startup, so a port check would report ready before any token can be issued.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/order-platform/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | head -1 | grep -q '200'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1g

  # ---------------------------------------------------------------------------------------
  # Services
  #
  # Every image is built from the REPO ROOT as context (context: ../..) because the
  # Dockerfiles are multi-module aware: they need the parent POM, the Maven wrapper and the
  # shared/* modules, which live outside the service directory.
  #
  # Config is passed as environment only — no code or application.yml change is needed to
  # run in compose. SPRING_* names are Spring Boot's relaxed binding for the properties the
  # YAML hardcodes for host-local development (localhost:5432 / localhost:9092).
  #
  # Healthchecks hit /actuator/health/readiness, not /actuator/health. The readiness group
  # holds the application's own readiness state; the aggregate endpoint holds the dependency
  # indicators — on Boot 4.1.1 that is db, diskSpace, ping and ssl (there is no Kafka
  # indicator on the classpath today, so the broker affects neither endpoint). Probing the
  # aggregate would still be wrong: one Postgres blip would flip every container to unhealthy
  # and take dependents down with it, and readiness must not fail on a dependency blip
  # (ADR-0014). The aggregate endpoint stays available for humans.
  # ---------------------------------------------------------------------------------------

  order-service:
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    image: edmp/order-service:local
    container_name: edmp-order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      # Its own least-privilege role (ADR-0007), granted only on the `public` schema it owns.
      POSTGRES_ORDER_USER: order_svc
      POSTGRES_ORDER_PASSWORD: ${POSTGRES_ORDER_PASSWORD:-changeme-dev-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER_URI: http://keycloak:8080/realms/order-platform
      JWT_AUDIENCE: ${JWT_AUDIENCE:-order-platform}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: edmp/payment-service:local
    container_name: edmp-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      POSTGRES_PAYMENT_USER: payment_svc
      POSTGRES_PAYMENT_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD:-changeme-dev-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    image: edmp/inventory-service:local
    container_name: edmp-inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      POSTGRES_INVENTORY_USER: inventory_svc
      POSTGRES_INVENTORY_PASSWORD: ${POSTGRES_INVENTORY_PASSWORD:-changeme-dev-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Availability cache on: this is the only service that uses Redis, and the flag also
      # switches on its health indicator, which is why redis is a service_healthy dependency.
      INVENTORY_CACHE_REDIS_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  # The only service published to the host. Stock for the demo SKUs (SKU-1001, SKU-1002:
  # 100 units each) is seeded by inventory-service's V1 migration, so a fresh `make up`
  # is immediately demonstrable.
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    image: edmp/api-gateway:local
    container_name: edmp-api-gateway
    environment:
      ORDER_SERVICE_URI: http://order-service:8080
      JWT_ISSUER_URI: http://keycloak:8080/realms/order-platform
      JWT_AUDIENCE: ${JWT_AUDIENCE:-order-platform}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-20}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC
    ports:
      - "${GATEWAY_HOST_PORT:-8090}:8090"
    depends_on:
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8090/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    mem_limit: 512m

volumes:
  postgres_data:
