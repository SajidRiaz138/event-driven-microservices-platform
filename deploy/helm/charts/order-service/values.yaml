# order-service. Every value here is the compose value from deploy/local/compose.yaml,
# with compose service names replaced by Kubernetes Service names of the same spelling —
# so the strings are identical, not merely equivalent.

component: saga-orchestrator

image:
  repository: edmp/order-service
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

containerPort: 8080
service:
  type: ClusterIP
  port: 8080
  portName: http

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
  # Its own least-privilege role (ADR-0007), granted only on the `public` schema it owns —
  # not the shared bootstrap appuser. Provisioned by the umbrella chart's postgres-init
  # ConfigMap, which is the same file the compose stack uses.
  POSTGRES_ORDER_USER: order_svc
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # The issuer is compared by exact string equality, and Keycloak stamps it from
  # KC_HOSTNAME. Both sides say http://keycloak:8080/realms/order-platform; changing one
  # without the other rejects every token (see the umbrella chart's keycloak values).
  JWT_ISSUER_URI: http://keycloak:8080/realms/order-platform
  JWT_AUDIENCE: order-platform
  # Without this, /actuator/health/readiness does not exist and the pod never goes Ready.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

secretEnv:
  # Only this service's own role password is mounted here.
  - name: POSTGRES_ORDER_PASSWORD
    secret: platform-secrets
    key: postgres-order-password

# compose mem_limit: 768m. MaxRAMPercentage=65 is computed from the limit, so the limit
# is what sizes the heap — keep them in step.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi

serviceAccount:
  create: true
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  startup:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36
  readiness:
    enabled: true
    path: /actuator/health/readiness
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    path: /actuator/health/liveness
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 5

nameOverride: ""
fullnameOverride: ""
strategy:
  type: RollingUpdate
terminationGracePeriodSeconds: 30
envFrom: []
podAnnotations: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: ""
nodeSelector: {}
tolerations: []
affinity: {}
