{{- if .Values.secrets.create }}
{{/*
Dev defaults, and nothing else. These are the same placeholder values .env.example ships
("changeme-dev-only", "admin") and states are not secrets. Nothing real is committed; a
real deployment overrides them on install or sets secrets.create=false and points the
services at a Secret managed elsewhere (External Secrets, sealed-secrets, a cloud secret
store).

stringData rather than data: base64 in a git-tracked template would only obscure the value
from a reader, not from anything that matters.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "platform.labels" (dict "root" $ "name" .Values.secrets.name "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-app-password: {{ .Values.secrets.postgresAppPassword | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
{{- end }}
