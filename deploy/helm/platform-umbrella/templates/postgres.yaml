{{- if .Values.postgres.enabled }}
{{/*
PostgreSQL 17.6 — one instance, one database, schema-per-service (ADR-0007).

A StatefulSet rather than a Deployment: the data directory is a PVC, and a rolling
Deployment would happily start a second pod attached to the same volume. `helm uninstall`
deliberately does not delete the PVC, so restarting the release keeps the data — see the
teardown section of the runbook for how to drop it on purpose.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "platform.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
data:
  {{/*
    Mirrors deploy/local/postgres-init/ — supplied with
    --set-file postgres.initSql=deploy/local/postgres-init/01-extensions.sql
    --set-file postgres.initRolesSh=deploy/local/postgres-init/02-service-roles.sh
    so each file exists once in the repository and cannot drift from the compose stack.
    The postgres image runs this directory once, as the bootstrap superuser, on first
    initialization of an empty data directory — same semantics as the bind mount it
    replaces, including the "only on a fresh volume" part — in filename order, so the
    extension is installed before the roles that depend on it being there.

    02-service-roles.sh arrives from the ConfigMap without the executable bit, so the
    entrypoint sources it rather than executing it. The script is written for that (no
    `exit`, no `set -u`), which is also how the compose bind mount runs it.
  */}}
  01-extensions.sql: |
{{ .Values.postgres.initSql | required "postgres.initSql is empty. Install with --set-file postgres.initSql=deploy/local/postgres-init/01-extensions.sql" | indent 4 }}
  02-service-roles.sh: |
{{ .Values.postgres.initRolesSh | required "postgres.initRolesSh is empty. Install with --set-file postgres.initRolesSh=deploy/local/postgres-init/02-service-roles.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "platform.selectorLabels" (dict "root" $ "name" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 8 }}
      annotations:
        checksum/init: {{ printf "%s%s" .Values.postgres.initSql .Values.postgres.initRolesSh | sha256sum }}
    spec:
      securityContext:
        {{/*
          fsGroup only. The official postgres entrypoint starts as root and drops to the
          postgres user itself; forcing runAsUser here would fight it. fsGroup is what
          makes the provisioned volume writable by that user.
        */}}
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: postgres-app-password
            {{/*
              Read by 02-service-roles.sh to set each service role's password. Postgres is the
              one place that needs all three; each service gets only its own key.
            */}}
            - name: POSTGRES_ORDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: postgres-order-password
            - name: POSTGRES_PAYMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: postgres-payment-password
            - name: POSTGRES_INVENTORY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: postgres-inventory-password
            {{/*
              A subdirectory, not the mount point itself: initdb refuses a non-empty
              directory, and a mounted volume is not guaranteed to be empty.
            */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: postgres-init
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
